name: Build Mobile (Android & iOS)

on:
  push:
    branches: [ "main", "Avalonia" ]
  pull_request:
    branches: [ "main", "Avalonia" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Workload
        run: dotnet workload install android

      - name: Build Android Project
        run: dotnet build src/MiHAva.Android/MiHAva.Android.csproj -c Release -p:AndroidPackageFormat=apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MiHAva-Android-APK
          path: src/MiHAva.Android/bin/Release/net8.0-android/*.apk
          if-no-files-found: warn

  build-ios:
    name: Build iOS App
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install iOS Workload
        run: dotnet workload install ios

      - name: Build iOS Project (Simulator)
        run: dotnet build src/MiHAva.iOS/MiHAva.iOS.csproj -c Release -p:RuntimeIdentifier=iossimulator-arm64
